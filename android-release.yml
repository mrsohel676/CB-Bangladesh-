name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Production server URL"
        required: true
        default: "https://ais-pre-4xl7h2rqb7wt2kw2pqspkq-157676141278.asia-southeast1.run.app"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CB_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cb-release.keystore"

      - name: Build APK and AAB
        env:
          SERVER_URL: ${{ inputs.server_url }}
          STORE_PASSWORD: ${{ secrets.CB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CB_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease bundleRelease \
            -PSERVER_URL="$SERVER_URL" \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/cb-release.keystore" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CB-Bangladesh-APK
          path: "**/build/outputs/apk/release/*.apk"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CB-Bangladesh-AAB
          path: "**/build/outputs/bundle/release/*.aab"
